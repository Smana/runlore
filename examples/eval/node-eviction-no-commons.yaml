      search/index-builder     2Gi
      kube-system/fluent-bit   256Mi
      payments/checkout-api    (no limit set)

    node_memory_MemTotal_bytes{instance="ip-10-0-22-115"}     = 16 GiB
    node_memory_MemAvailable_bytes{instance="ip-10-0-22-115"} = 78 MiB
      (allocatable is 15.6 GiB; the 0.4 GiB gap to capacity is kube-reserved +
       system-reserved + evictionHard, which is where the kubelet/containerd/OS
       working set lives — so 15.52 GiB of pods plus 0.4 GiB of node overhead accounts
       for 15.92 GiB of the 16 GiB, leaving the 78 MiB above)
  what_changed: |
    flux Kustomization/analytics  9f3a21..c7d004  (reconciled 2026-08-03T08:41:12Z)
    --- analytics/report-worker/values.yaml
    -  parallelWorkers: 4
    +  parallelWorkers: 16        # nightly backfill throughput
       resources:
         requests:
           memory: 256Mi          # unchanged
         limits:
           memory: 8Gi            # unchanged
       priorityClassName: batch-critical   # unchanged

    no changes to payments/checkout-api or search/index-builder in the last 24h
  workload_ownership: |
    Pod/report-worker-7c9f4d5b6-jt2lm → ReplicaSet/report-worker-7c9f4d5b6 → Deployment/report-worker
      (namespace analytics; flux Kustomization/analytics)
    Pod/checkout-api-6f4b9c7d8-2xk4p → ReplicaSet/checkout-api-6f4b9c7d8 → Deployment/checkout-api
      (namespace payments; flux Kustomization/payments)
    Pod/index-builder-5d8c6b4f9-nk7vt → ReplicaSet/index-builder-5d8c6b4f9 → Deployment/index-builder
      (namespace search; flux Kustomization/search)
  query_logs: |
    ingress-nginx  upstream connect error or disconnect/reset before headers → payments/checkout-api (x412 in 5m)
    report-worker  backfill batch 118/240 complete (16 workers)
    index-builder  starting segment merge (heap target 1.5Gi)
expected:
  # Scored on WHAT WAS BLAMED, not on keyword overlap: root_cause_entities is matched
  # over the claim text only, and a distractor found there is an over-claim.
  #
  # Two entities that LOOK like distractors are deliberately absent from the list, for
  # the same reason: Score() penalises a distractor named in the CLAIM, and a correct
  # claim names both of them.
  #
  #   * checkout-api — a correct claim names the victim as the affected party
  #     ("...so the kubelet evicted checkout-api"). Listing it would fail correct
  #     investigations, which is worse than not scoring the trap at all.
  #   * index-builder — the ground truth below names it too. Distinguishing a bounded,
  #     Guaranteed, container-level OOMKill from node-level pressure IS the
  #     discriminating step here, and the commons playbook's "# Not covered" section
  #     actively tells the model to make it. Listing it would therefore penalise the
  #     GROUNDED arm hardest, and the pair would report the commons as harmful in
  #     exactly the runs where it helped.
  #
  # That leaves one valid distractor. The case stays scored on entity precision rather
  # than dropping back to keyword overlap, and no replacement was invented to pad the
  # list — an entity a correct claim has no reason to name is the only thing that
  # belongs here, and there is exactly one.
  root_cause_entities: [report-worker]
  distractors:
    - fluent-bit      # over its 64Mi request, but 183MiB of a 15.6GiB node — and
                      # system-node-critical, so the kubelet never queued it at all
  must_contain: [memory, request]
  min_confidence: 0.5
ground_truth:
  root_cause: |
    analytics/report-worker went from 4 to 16 parallel workers without its memory
    request changing (256Mi), so its working set grew to 7.42GiB while the scheduler
    kept placing work on ip-10-0-22-115 as if it needed 256Mi. Pod memory requests on
    the node sum to 8.0Gi of 15.6Gi allocatable while actual pod usage reached 15.52Gi,
    and report-worker alone accounts for 7.17Gi of that 7.5Gi gap — textbook overcommit.

    The kubelet then evicted by its documented ranking: pods exceeding their requests
    first, ordered by Priority and then by how far each exceeds its request.
    report-worker is furthest above its request by an order of magnitude, but it carries
    the batch-critical PriorityClass (10000), so the kubelet skipped it and took the
    highest-ranked priority-0 pods instead — payments/checkout-api, 86Mi and 80Mi above
    their 128Mi requests. The evicted pods are victims, not the cause; the PriorityClass
    is why the victims were the payments API specifically.

    search/index-builder's OOMKills are a separate, self-limiting container-sizing
    problem: it is Guaranteed (request == limit == 2Gi) and runs BELOW its request, so
    it sits in the bucket the kubelet evicts last and never contributed to node pressure
    at all.
  expected_sources: [kubernetes, metrics]
  optional_sources: [gitops, kb, logs]
  expected_action: |
    Raise analytics/report-worker's memory request to match its real working set (and
    bring its request and limit closer together) so the scheduler stops overcommitting
    the node; do it in Git and reconcile. Separately, reconsider why a nightly backfill
    outranks the payments API in the kubelet's eviction order.
  must_reach_root: true
