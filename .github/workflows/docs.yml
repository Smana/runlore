name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [scorecard-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: "0.156.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Hugo Extended
        run: |
          wget -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      # Pull the published scorecard from the eval-scorecard orphan branch and render
      # it as /eval. The branch is the nightly's publishing target; copying it in at
      # build time keeps main free of generated numbers. A missing branch is NOT a
      # failure — the committed placeholder stands in, so the docs deploy and the
      # link stay alive either way.
      - name: Render the eval scorecard page
        run: |
          set -euo pipefail
          if ! git fetch --depth=1 origin eval-scorecard 2>/dev/null; then
            echo "::notice title=Eval scorecard::branch not published yet — keeping the placeholder"
            exit 0
          fi
          # The branch exists but may not carry a readable scorecard.md (a partial
          # push, or a run that died between creating the branch and writing to it).
          # Capture it FIRST so a failure here keeps the committed placeholder rather
          # than truncating the page — or, worse, aborting the whole docs deploy under
          # `set -e` while the branch-missing case is handled gracefully right above.
          if ! scorecard=$(git show FETCH_HEAD:scorecard.md 2>/dev/null) || [ -z "$scorecard" ]; then
            echo "::notice title=Eval scorecard::branch has no readable scorecard.md — keeping the placeholder"
            exit 0
          fi
          published=$(git log -1 --format=%cI FETCH_HEAD)
          {
            echo "---"
            echo "title: Eval scorecard"
            echo "---"
            echo
            echo "*Published ${published} from the [\`eval-scorecard\`](https://github.com/Smana/runlore/tree/eval-scorecard) branch.*"
            echo
            printf '%s\n' "$scorecard"
          } > website/content/eval.md
      - name: Build
        working-directory: website
        # No `hugo mod get` — it would upgrade the pinned Hextra. The build
        # fetches the exact version from go.mod/go.sum automatically.
        # baseURL comes from hugo.yaml (https://runlore.io/) — do NOT override with
        # configure-pages' output, which resolves to http:// and yields http canonical URLs.
        run: hugo --minify --gc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
