name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [scorecard-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: "0.156.0"
      # Pins the ARTIFACT, not just its name: a release asset can be replaced under
      # an unchanged tag, and this .deb is installed as root on the one runner in
      # this repo that holds pages:write + id-token:write. Bump it together with
      # HUGO_VERSION — the value is the hugo_extended_<version>_linux-amd64.deb line
      # of the release's hugo_<version>_checksums.txt.
      HUGO_SHA256: "28111b85cd44c258c0cc59da00ae2210c12a55749b7fd77e7421ab963b7adcda"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install Hugo Extended
        run: |
          set -euo pipefail
          wget -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  /tmp/hugo.deb" | sha256sum -c -
          sudo dpkg -i /tmp/hugo.deb
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Pull the published scorecard from the eval-scorecard orphan branch and splice
      # it into /eval. The branch is the nightly's publishing target; copying it in at
      # build time keeps main free of generated numbers.
      #
      # This INJECTS between the page's `scorecard:begin/end` markers rather than
      # rewriting the file: the framing above the markers (what a scenario is, what the
      # number does not mean, where the cases live) is hand-written and must survive
      # every republish. Overwriting the page — the previous behaviour — destroyed it.
      #
      # A missing branch is NOT a failure — the committed placeholder stands in, so the
      # docs deploy and the link stay alive either way.
      - name: Render the eval scorecard page
        run: |
          set -euo pipefail
          page=website/content/eval.md
          # A malformed marker pair is a repo-side regression, not a publishing hiccup,
          # and every way of getting it wrong fails SILENTLY: the awk below splices on
          # `$0 == marker`, so it matches WHOLE lines. A stray trailing space on the
          # begin marker means awk never injects and /eval keeps telling readers nothing
          # has been published — on a green deploy. The same on the end marker means awk
          # never leaves skip mode, so everything from begin to EOF is dropped. Doubled
          # markers inject twice; a reversed pair duplicates the page body.
          #
          # So this guard uses awk's own comparison rather than a substring grep, which
          # would green-light every one of those, and asserts the whole shape: one of
          # each marker, on its own line, in order. internal/docsguard pins the same
          # shape at PR time, where the fix is cheap; this is belt-and-braces for a
          # marker lost in a merge, and it runs before the fetch so a malformed page is
          # reported even when there is nothing to publish.
          if ! shape=$(awk '
            $0 == "<!-- scorecard:begin -->" { b++; bl = NR }
            $0 == "<!-- scorecard:end -->"   { e++; el = NR }
            END {
              if (b != 1 || e != 1) { printf "expected exactly one of each marker on its own line, found %d begin / %d end", b + 0, e + 0; exit 1 }
              if (bl > el) { printf "the end marker (line %d) comes before the begin marker (line %d)", el, bl; exit 1 }
            }' "$page"); then
            echo "::error title=Eval scorecard::$page has a malformed scorecard marker block — $shape; the published scorecard has nowhere to go"
            exit 1
          fi
          if ! git fetch --depth=1 origin eval-scorecard 2>/dev/null; then
            echo "::notice title=Eval scorecard::branch not published yet — keeping the placeholder"
            exit 0
          fi
          # The branch exists but may not carry a readable scorecard.md (a partial
          # push, or a run that died between creating the branch and writing to it).
          # Capture it FIRST so a failure here keeps the committed placeholder rather
          # than truncating the page — or, worse, aborting the whole docs deploy under
          # `set -e` while the branch-missing case is handled gracefully right above.
          if ! scorecard=$(git show FETCH_HEAD:scorecard.md 2>/dev/null) || [ -z "$scorecard" ]; then
            echo "::notice title=Eval scorecard::branch has no readable scorecard.md — keeping the placeholder"
            exit 0
          fi
          published=$(git log -1 --format=%cI FETCH_HEAD)
          # The scenario count of THAT run, so the provenance sentence states it as a
          # property of the run and a reader can diff it against the case directory the
          # framing links to. It comes from history.jsonl — the machine-readable artifact
          # `lore eval scorecard` writes into the same commit, whose last line is this run
          # — rather than being scraped back out of scorecard.md's prose, which would bind
          # this step to a Go format string nothing ties to the docs. Absent file or field
          # ⇒ empty ⇒ the sentence degrades to the date alone, never a wrong number.
          total=$(git show FETCH_HEAD:history.jsonl 2>/dev/null | tail -1 | jq -r '.total // empty' 2>/dev/null || true)
          covered=""
          if [ -n "$total" ]; then
            noun="scenarios"
            if [ "$total" = "1" ]; then noun="scenario"; fi
            covered=" It covered the **${total} ${noun}** the suite held at that time."
          fi
          block=$({
            echo "> **Published ${published}** from the [\`eval-scorecard\`](https://github.com/Smana/runlore/tree/eval-scorecard)"
            echo "> branch.${covered}"
            echo "> The [case definitions](https://github.com/Smana/runlore/tree/main/examples/eval) are the suite as"
            echo "> it stands today — more files there than this run covered means it has grown since."
            echo
            # Drop the generated H1: the page already has one (its title), and the
            # scorecard's own `##` sections then sit at the same level as the framing's.
            # A no-op if the generator ever stops emitting it. `/./,$!d` then eats the
            # blank line it left behind, so the block above is always separated from the
            # scorecard by exactly one — whether or not the H1 was there to delete.
            sed -e '1{/^# /d;}' -e '/./,$!d' <<<"$scorecard"
          })
          # ENVIRON hands awk the block verbatim: no escape processing (which is what
          # rules out `awk -v`) and no shell interpolation of scorecard text, which is
          # full of backticks, $ and quotes. Both markers are kept so the substitution
          # stays repeatable.
          BLOCK="$block" awk '
            $0 == "<!-- scorecard:begin -->" { print; print ENVIRON["BLOCK"]; skip = 1; next }
            $0 == "<!-- scorecard:end -->"   { skip = 0 }
            !skip { print }
          ' "$page" > "$page.new"
          mv "$page.new" "$page"
      - name: Build
        working-directory: website
        # No `hugo mod get` — it would upgrade the pinned Hextra. The build
        # fetches the exact version from go.mod/go.sum automatically.
        # baseURL comes from hugo.yaml (https://runlore.io/) — do NOT override with
        # configure-pages' output, which resolves to http:// and yields http canonical URLs.
        run: hugo --minify --gc
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
