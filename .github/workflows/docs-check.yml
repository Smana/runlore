name: Docs check

# Validates the documentation on every change: the Hugo site must build
# (a broken internal link fails the build via refLinksErrorLevel: ERROR),
# and README/CONTRIBUTING must not reintroduce raw docs/*.md links.
on:
  pull_request:
    paths:
      - 'website/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'assets/**'
      # The card renderer: changing it is what makes the shipped screenshots wrong.
      - 'internal/notify/slack.go'
      - 'internal/notify/format.go'
      - 'hack/check-screenshots-fresh.sh'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'assets/**'
      # The card renderer: changing it is what makes the shipped screenshots wrong.
      - 'internal/notify/slack.go'
      - 'internal/notify/format.go'
      - 'hack/check-screenshots-fresh.sh'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.156.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Hugo Extended
        run: |
          wget -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Build the site (broken internal refs fail here)
        working-directory: website
        # No bare `hugo mod get` — it would upgrade the pinned Hextra.
        run: hugo --minify --gc

      - name: In-page anchors must resolve
        # refLinksErrorLevel: ERROR above covers relref between pages; it does not look
        # at fragment links within a page. Runs against the HTML the step above rendered.
        run: hack/check-anchors.sh

      - name: README/CONTRIBUTING must not link to raw docs/*.md
        run: |
          if grep -nE '\]\((\.?/)?docs/[a-z0-9/_-]+\.md' README.md CONTRIBUTING.md; then
            echo "::error::README/CONTRIBUTING still link to raw docs/*.md — repoint to https://runlore.io/docs/…"
            exit 1
          fi
          echo "OK: no raw docs/*.md links in README/CONTRIBUTING"

      - name: Screenshots must not predate the card renderer
        # Needs full history (fetch-depth: 0 above) — it compares git commit times,
        # not mtimes, which a fresh clone would make all equal.
        run: hack/check-screenshots-fresh.sh
