name: Docs check

# Validates the documentation on every change: the Hugo site must build
# (a broken internal link fails the build via refLinksErrorLevel: ERROR),
# and README/CONTRIBUTING must not reintroduce raw docs/*.md links.
on:
  pull_request:
    paths:
      - 'website/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'assets/**'
      # The rendered card, not the files that render it: what makes the shipped
      # screenshots wrong is a change a READER would notice, and this golden moves
      # if and only if one happened. Triggering on slack.go instead ran the whole
      # Hugo build for every transport change and, worse, failed the screenshot
      # step on four PRs that moved no pixel.
      - 'internal/notify/testdata/incident-card.golden.json'
      - 'hack/check-screenshots-fresh.sh'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'assets/**'
      # The rendered card, not the files that render it: what makes the shipped
      # screenshots wrong is a change a READER would notice, and this golden moves
      # if and only if one happened. Triggering on slack.go instead ran the whole
      # Hugo build for every transport change and, worse, failed the screenshot
      # step on four PRs that moved no pixel.
      - 'internal/notify/testdata/incident-card.golden.json'
      - 'hack/check-screenshots-fresh.sh'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.156.0"
      # Keep in step with docs.yml — same release, same pin. See the note there for
      # why the checksum is pinned alongside the version.
      HUGO_SHA256: "28111b85cd44c258c0cc59da00ae2210c12a55749b7fd77e7421ab963b7adcda"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install Hugo Extended
        run: |
          set -euo pipefail
          wget -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  /tmp/hugo.deb" | sha256sum -c -
          sudo dpkg -i /tmp/hugo.deb

      - name: Build the site (broken internal refs fail here)
        working-directory: website
        # No bare `hugo mod get` — it would upgrade the pinned Hextra.
        run: hugo --minify --gc

      - name: In-page anchors must resolve
        # refLinksErrorLevel: ERROR above covers relref between pages; it does not look
        # at fragment links within a page. Runs against the HTML the step above rendered.
        run: hack/check-anchors.sh

      - name: README/CONTRIBUTING must not link to raw docs/*.md
        run: |
          if grep -nE '\]\((\.?/)?docs/[a-z0-9/_-]+\.md' README.md CONTRIBUTING.md; then
            echo "::error::README/CONTRIBUTING still link to raw docs/*.md — repoint to https://runlore.io/docs/…"
            exit 1
          fi
          echo "OK: no raw docs/*.md links in README/CONTRIBUTING"

      - name: Screenshots must show the card RunLore actually draws
        # Compares a digest of the rendered card, so it needs no git history — the
        # fetch-depth: 0 above is Hugo's (lastmod from git), not this step's. The
        # golden it reads is kept honest by TestSlackCardMatchesTheShippedGolden in
        # the `ci` workflow; this step alone would accept a hand-edited file.
        run: hack/check-screenshots-fresh.sh
