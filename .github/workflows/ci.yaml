name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo. Override per-job if a
# step needs more (e.g. SARIF upload needs security-events: write).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: SPDX headers
        run: |
          missing=""
          for f in $(git ls-files '*.go'); do
            head -1 "$f" | grep -q '^// SPDX-License-Identifier: Apache-2.0$' || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "Missing SPDX-License-Identifier header (must be the first line):"
            for f in $missing; do echo "  $f"; done
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test (with race detector)
        run: go test -race ./...
      - name: validate the shipped runbook seeds (OKF merge gate)
        # `lore validate-kb` exits non-zero on any structural error, so an entry the
        # loader would reject cannot land in what RunLore ships as example knowledge.
        # Built from THIS checkout rather than a pinned release: the validator and the
        # entries move together, and a PR touching both must be judged against its own
        # gate.
        #
        # The knowledge commons is NOT validated here — it lives in
        # github.com/Smana/runlore-kb-commons and runs this same validator in its own
        # CI. A copy here would be a fork that drifts, not a second safety net.
        run: go run ./cmd/lore validate-kb examples/runbooks
      - name: govulncheck
        # Checks the module graph against the Go vulnerability DB; fails on a
        # known-vulnerable, reachable call path. Run via `go run` to avoid a
        # go.mod dependency (pinned by the module cache + checksum DB).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: shellcheck
        # Default severity, deliberately: install.sh is fetched and executed by users
        # over the network, so it is the last script in this repo that should sit
        # behind a lowered gate. The one pre-existing info-level note that blocked the
        # default was fixed rather than muted.
        # Preinstalled on the ubuntu-latest runner image.
        run: shellcheck hack/*.sh website/static/install.sh
