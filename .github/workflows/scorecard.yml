# OpenSSF Scorecard — a weekly automated assessment of this repo's supply-chain
# posture (branch protection, pinned dependencies, signed releases, SAST…). Results
# publish to the Security tab; the badge in the README links to the public report.
#
# Job permissions match exactly what ossf/scorecard-action's own README documents
# for a public repo (see ossf/scorecard's own scorecard-analysis.yml, which this
# mirrors) — job-level `permissions:` fully replaces the workflow-level `read-all`
# for this job, so nothing beyond these two scopes is granted.
name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"      # Mondays 05:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to the Security tab
      id-token: write          # publish the signed result to the public API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
