# Full profile — the hardened production shape: leader-elected HA, a durable data
# path, a default-deny NetworkPolicy, rung-2 (human-approved) actions, cloud +
# network-flow evidence, and instant recall.
#
# It is an OVERLAY on the chart's own values.yaml, NOT the effective config. Helm
# deep-merges the two, so what actually runs also carries every default this file
# leaves unmentioned — resources, probes, tolerations, affinity, curate.cronjob,
# the trigger debounces, the coalesce/rate-limit ceilings. Nothing here is the
# complete picture of a running install; deploy/helm/runlore/values.yaml is the
# exhaustive, commented list. The keys below are the ones a production install has
# to decide for itself.
#
# It is also a REFERENCE, not a drop-in: the cloud/network blocks below describe one
# concrete environment (EKS + Cilium), and every CIDR, repo, ID and namespace is a
# placeholder. Read it top to bottom, keep what matches your cluster, delete the rest —
# every block here is independently optional. Start from values-standard.yaml if you
# want the learning loop without the operational hardening, or values-minimal.yaml for
# investigate + notify only.
#
# https://runlore.io/docs/getting-started/#the-full-loop--production-install
#
# The Secret this expects (one extra key over values-standard.yaml: APPROVAL_TOKEN,
# which gates the action approval + kill-switch endpoints):
#
#   kubectl -n runlore create secret generic runlore-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=RUNLORE_WEBHOOK_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=APPROVAL_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=SLACK_WEBHOOK_URL=https://hooks.slack.com/services/... \
#     --from-file=GITHUB_APP_PRIVATE_KEY=/path/to/app-private-key.pem

# HA: every warm replica is Ready and serves the webhook, but only the elected
# leader investigates — a non-leader proxies incoming work to it in one hop.
replicaCount: 2

# StatefulSet, not Deployment, because persistence is on below: a Deployment shares
# ONE PVC across replicas, which an RWO (EBS-class) volume cannot attach to a standby
# on another node. volumeClaimTemplates give each replica its own volume instead.
# Trade-off: a new leader starts with an EMPTY local outcome ledger (the catalog is
# unaffected — it re-clones from git). With an RWX StorageClass (EFS) prefer
# workloadKind: Deployment + accessModes: [ReadWriteMany] and keep the ledger.
workloadKind: StatefulSet

image:
  tag: "" # defaults to the chart appVersion; PIN IT in production

envFrom:
  - secretRef:
      name: runlore-secrets

catalog:
  gitSync: true
  mountPath: /var/lib/runlore/catalog

# Durability for the writable data path: without it the outcome ledger and the
# hash-chained action audit log live in an emptyDir and are destroyed on every
# restart, upgrade and failover.
persistence:
  enabled: true
  storageClass: "" # cluster default; must be RWO-capable for the accessModes below
  accessModes: [ReadWriteOnce]
  size: 5Gi

podDisruptionBudget:
  create: true
  minAvailable: 1

# The identity the AWS calls under config.cloud below authenticate as. EKS Pod
# Identity needs NO annotation (the association is created on the AWS side — that is
# the mode networkPolicy.awsPodIdentity exists for). IRSA binds the read-only role by
# annotation instead, and without it the AWS SDK finds no credentials at all, so
# cloud_what_changed / cloud_resource_health fail at runtime rather than at install.
serviceAccount:
  create: true
  annotations: {}
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/runlore-readonly

# Cluster-write RBAC for the action ladder. actionNamespaces MIRRORS
# config.actions.allow.namespaces below and is granted as namespace-scoped Roles
# only — never cluster-wide — so the blast radius stays bounded. flux-system and
# kube-system are protected built-ins and can never be action targets.
rbac:
  allowActions: true
  actionNamespaces: [apps]
  controllerLogNamespaces: [flux-system] # where pods/log is granted for controller_logs

# Default-deny egress: the agent may ONLY reach what is listed here. That means
# EVERY endpoint this file turns on under `config:` — model API, git forge, the
# Kubernetes API, metrics, logs, Hubble, AWS — needs a matching rule, or the CNI
# drops the traffic with NO error anywhere: the tool it served just returns nothing.
# Treat the two halves as one edit; adding a `url:` below without a rule here is the
# single easiest way to make this profile quietly useless.
#
# Ingress is scoped to the namespace that owns Alertmanager — combined with the
# webhook token, that is what stops a neighbour pod POSTing synthetic alerts and
# burning your model spend. Leave strict: false if pinning egress IPs is impractical;
# ingressFrom is worth setting either way.
networkPolicy:
  enabled: true
  strict: true
  egress:
    # allowedCIDRs and namespaceSelectors open port 443 ONLY; apiServerCIDRs opens
    # 6443 ONLY. Everything else needs an extraEgress rule further down.
    #
    # allowedCIDRs is NOT just the model provider: it must carry every off-cluster
    # HTTPS destination — the model API, the git forge (api.github.com AND
    # codeload.github.com for the catalog clone), and, on a MANAGED control plane,
    # the Kubernetes API itself. Hostnames resolve to IPs that move, so pin the CIDR
    # your traffic actually leaves through: a NAT gateway EIP, an egress proxy, or a
    # PrivateLink endpoint subnet — not a DNS answer you resolved once.
    # BOTH entries are PLACEHOLDERS. They are ALLOW rules, so a value copied verbatim
    # does not fail closed — it silently grants egress to whatever sits at that address
    # in YOUR network. Replace both before applying this profile.
    #
    # 203.0.113.0/24 is RFC 5737 TEST-NET-3 (documentation-only, routes nowhere), which
    # is why it is safe to ship. There is no documentation range for RFC 1918, so the
    # second entry is a plausible-looking private address and is the more dangerous of
    # the two to leave in place.
    allowedCIDRs:
      - "203.0.113.10/32" # PLACEHOLDER — model provider + git forge (e.g. this cluster's NAT gateway EIP)
      - "10.0.0.1/32" # PLACEHOLDER — the EKS API server endpoint; managed APIs are on 443, see below
      #   resolve yours: kubectl -n default get endpoints kubernetes
    namespaceSelectors: [] # in-cluster backends that speak 443 (none in this example)
    # apiServerCIDRs renders port 6443 ONLY, which is the SELF-MANAGED shape (kubeadm,
    # k3s, RKE). EKS — and GKE/AKS — serve the API on 443, so on this profile's EKS
    # framing the endpoint goes in allowedCIDRs above and this list stays EMPTY. Put an
    # EKS endpoint here instead and every Kubernetes read (pod status, events, logs) is
    # silently dropped. Confirm which shape you have before choosing:
    #   kubectl -n default get endpoints kubernetes
    apiServerCIDRs: []
  # Anything on ANOTHER port, or needing its own justification, is spelled out here —
  # extraEgress is appended verbatim in both modes. These mirror the endpoints
  # configured under `config:` below; change the two together or the tool silently
  # stops answering.
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { protocol: TCP, port: 8429 } # VictoriaMetrics — config.metrics.url
        - { protocol: TCP, port: 9428 } # VictoriaLogs — config.logs.url
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: TCP, port: 80 } # Hubble Relay gRPC — config.network.hubble.url
    # AWS control plane — config.cloud below. awsPodIdentity covers ONLY the
    # 169.254.170.23:80 credential fetch; the API calls themselves (cloudtrail, eks,
    # ec2, autoscaling, sts — all `*.eu-west-3.amazonaws.com` on 443) are ordinary
    # HTTPS egress and are dropped without this rule, leaving cloud_what_changed and
    # cloud_resource_health permanently empty. AWS endpoint IPs are dynamic, so pin
    # one of these instead of a resolved address, narrowest first:
    #   1. interface VPC endpoints (PrivateLink) for cloudtrail/eks/ec2/sts, and list
    #      the endpoint SUBNET CIDRs here — the traffic never leaves the VPC;
    #   2. your NAT gateway EIP (the same CIDR as allowedCIDRs above when egress is
    #      shared — then this rule is redundant and can be deleted);
    #   3. the region's AMAZON prefixes from AWS ip-ranges.json (wide, and it moves).
    # Delete this rule entirely if you delete config.cloud.
    - to:
        - ipBlock:
            cidr: 10.0.16.0/20 # PLACEHOLDER: the PrivateLink endpoint subnets in eu-west-3
      ports:
        - { protocol: TCP, port: 443 }
  ingressFrom:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: monitoring }
  # Cilium only: the EKS Pod Identity credential endpoint (169.254.170.23:80) runs on
  # the node host network, which a plain NetworkPolicy cannot match — the credential
  # fetch is then silently dropped and the AWS tools below never authenticate. This
  # is the CREDENTIAL fetch only; the AWS API calls it authorises need the 443 rule
  # in extraEgress above.
  awsPodIdentity: true

vmServiceScrape:
  enabled: true

config:
  gitops:
    engine: flux # or "argocd"

  sources:
    alertmanager: {}
    gitops:
      enabled: true

  triggers:
    incidents:
      match:
        severity: [critical, warning]
      dedup: { window: 30m }

  model:
    provider: anthropic # or `openai` + base_url for any OpenAI-compatible endpoint
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    # Route the adversarial verify pass to a cheaper model to cut the +1 call per
    # investigation. Verify ALWAYS runs; this only lowers its cost.
    verify:
      model: claude-haiku-4-5

  server:
    webhook_token_env: RUNLORE_WEBHOOK_TOKEN

  notify:
    slack:
      webhook_url_env: SLACK_WEBHOOK_URL
      # Verifies every button click below (±5 min replay window).
      signing_secret_env: SLACK_SIGNING_SECRET
      # OPT-IN 🔕: a third control beside 👍/👎 that suppresses re-investigating a
      # trigger for the chosen window (notify.silence below) — no model call, no
      # notification, no ledger open — until it expires, a CRITICAL fires, a 👎
      # lands (newest human wins), or the incident resolves. Gated independently
      # of feedback_buttons — but the 👎 escape needs a 👍/👎 control enabled on
      # SOME transport, so turning this on with neither feedback_buttons nor
      # matrix.feedback_reactions removes it (startup warns).
      silence_button: true
    # Shared presets for the 🔕 control above: windows[0] is used wherever no
    # duration can be carried (a bare Matrix reaction). Requires outcome.ledger_path
    # (set below) and at least one of slack.silence_button / matrix.silence_reactions.
    silence:
      windows: [1h, 4h, 24h]
      max_window: 24h

  catalog:
    dir: /var/lib/runlore/catalog # must match catalog.mountPath above
    git:
      url: https://github.com/your-org/runlore-kb
      branch: main
      interval: 5m
    # Instant recall short-circuits the whole LLM loop when the catalog already holds
    # a trustworthy answer for this incident — the payoff for curating knowledge back.
    # The fire gate is a CALIBRATED LLM reranker (on by default once enabled), so there
    # is no per-corpus BM25 threshold to tune.
    instant_recall:
      enabled: true

    # A SECOND, read-only catalog root: a shared corpus of generic playbooks that
    # covers common failure classes, so kb_search returns something useful on day one
    # before you have curated an entry of your own. Both roots are indexed together.
    #
    # Two properties are worth knowing before you enable it:
    #   - Commons entries NEVER fire instant recall. They are resource-less by
    #     construction (they describe a failure class, not one cluster's workload),
    #     and recall's structural filter rejects a resource-less entry for any alert
    #     that carries a workload. They ground kb_search, which applies no such filter.
    #   - The curator never writes here. Drafted entries always land in your own
    #     catalog repo; the commons is a mirror of upstream and stays pristine.
    # On a scoring tie your own entry wins, so the commons can only ever be a floor.
    #
    # dir MUST differ from catalog.dir above — the chart refuses to render otherwise.
    # It is mounted as an emptyDir and re-cloned on startup; nothing is authored here.
    commons:
      url: https://github.com/Smana/runlore-kb-commons
      branch: main
      # ref: v1.2.0                     # PIN the corpus — comment out `branch` above to use it
      #
      # branch and ref are mutually exclusive (the agent refuses to start with both).
      #   branch: upstream edits reach kb_search at the next interval — you get shared
      #           fixes without doing anything, from a repo you do not control.
      #   ref:    a tag or a full 40-character commit id. The corpus is frozen until
      #           you bump it, so you can read the upstream diff before it grounds an
      #           investigation. Polling a pin costs nothing (nothing can move), and
      #           you stop receiving upstream corrections until you move it yourself.
      # Neither is the safe choice in the abstract — pick the one that matches how
      # much you want to review. What pinning does NOT change: commons entries are
      # read-only, never curated into, and can never fire instant recall.
      interval: 24h                     # a shared corpus changes slowly; do not poll it like your own
      dir: /var/lib/runlore/commons
      # token_env: COMMONS_TOKEN        # only for a PRIVATE commons repo

  # The learning loop's memory: which diagnoses actually resolved the incident. It
  # weighs recall trust, and it is what recurrence_cooldown and the grooming sweeps
  # read. Keep it UNDER catalog.mountPath so it lands on the volume above.
  outcome:
    ledger_path: /var/lib/runlore/catalog/outcomes.jsonl

  forge:
    kb_repo: your-org/runlore-kb
    base_branch: main
    skip_verdicts: [no_action]
    github_app:
      app_id: 123456
      installation_id: 7654321
      private_key_env: GITHUB_APP_PRIVATE_KEY
    # GitHub Enterprise Server only — both keys are absent on github.com.
    # github_api_url: https://ghe.example.com/api/v3
    # git_host names the one host RunLore may send the forge credential to when it
    # clones; it is derived from github_api_url and needed ONLY under subdomain
    # isolation (API on api.HOSTNAME, git on HOSTNAME), which RunLore refuses to guess:
    # the pod CrashLoopBackOffs at config load until you set it. Under
    # networkPolicy.strict above, remember to add BOTH hosts to egress.allowedCIDRs.
    #   github_api_url: https://api.ghe.example.com
    #   git_host: ghe.example.com

  # Phase-2 grooming. The chart's values.yaml already ships stale_after,
  # recurrence_threshold and the in-server sweeps (DRY-RUN by default — nothing below
  # reaches the forge until you set curate.sweeps.mode: apply there). What is added
  # here is the one grooming pass a production install has to decide for itself.
  curate:
    # How a catalog entry EARNS freshness. RunLore leaves `last_validated` unset when
    # it drafts an entry — the field claims a HUMAN confirmed the entry works, and a
    # fresh draft has no such confirmation — so without this pass an entry's freshness
    # can only ever decay from its creation date. When an entry is recalled for a live
    # incident and that incident then RESOLVES, this opens a human-reviewed PR stamping
    # `last_validated` with the resolve date: a one-line frontmatter edit, no status or
    # content change, and merging it IS the confirmation. RunLore never writes it.
    #
    # It changes what an on-call reader sees only once catalog.instant_recall.stale_after
    # is set — that age gate is the thing that reads `last_validated`. With no
    # stale_after there is no staleness down-weight, and so nothing for this pass to
    # keep an entry ahead of.
    revalidation:
      enabled: true
      min_interval: 720h # at most one confirmation PR per entry per month
      max_open: 5 # never leave more than this many waiting on a reviewer
      # floor/prior are left unset on purpose: they INHERIT curate.retirement's (which
      # default to 0.5 / 2.0 — the same outcome gate recall's Gate 3 uses), and setting
      # them to two different values while both passes are enabled is rejected at load.
      # Equality is what makes the passes complementary rather than contradictory:
      # strictly below the floor is retirement's territory, at or above it is this
      # pass's, so one sweep can never propose retiring and revalidating one entry.
      #
      # Sizing note: max_open bounds the REVIEW queue, not the forge reads. Every sweep
      # still costs one read per candidate whose entry is already fresh — the anti-spam
      # check reads the file on the base branch, which is what lets a merged stamp
      # silence the next sweep with no state to keep. On a large catalog raise
      # curate.sweeps.interval rather than lowering max_open.

  metrics:
    url: http://vmsingle.observability.svc:8429
  logs:
    url: http://victorialogs.observability.svc:9428

  # Cloud control plane (read-only, in-cluster identity — no static AWS keys). Unlocks
  # cloud_what_changed (CloudTrail) and cloud_resource_health, so an infra change that
  # never touched GitOps is still visible. Needs the IAM policy bound to the
  # ServiceAccount via EKS Pod Identity or IRSA (see serviceAccount above) — AND, under
  # networkPolicy.strict, the 443 egress rule in extraEgress above, or both tools
  # return nothing at all.
  cloud:
    provider: aws
    region: eu-west-3
    cluster_name: your-eks-cluster
  # On GKE this whole block becomes, with nothing else in this profile changing:
  #   cloud:
  #     provider: gcp   # nothing else needed — project/location/cluster_name
  #                     # autodetect from the GKE metadata server.
  # Auth is a Workload Identity DIRECT PRINCIPAL BINDING: leave serviceAccount.annotations
  # above EMPTY on GKE. See values.yaml's cloud: comment for the full IAM binding loop
  # (three read-only roles) and why annotating the ServiceAccount is the wrong move —
  # it silently redirects auth to a GSA holding none of those roles.

  # Network-flow evidence for network_drops. PLUGGABLE and CNI-agnostic — hubble is
  # one of three providers (aws-vpc-flow-logs and gcp-firewall-logs need no Cilium).
  network:
    provider: hubble
    hubble:
      url: hubble-relay.kube-system:80

  investigation:
    # Skip re-investigating a trigger looked at less than this long ago that already
    # has a CONCLUSIVE answer on record — otherwise a still-firing alert
    # re-investigates on every Alertmanager repeat and a broken Kustomization on every
    # ~10m resync. A trigger that has never concluded always retries; a 👎 re-arms
    # immediately. Requires outcome.ledger_path above.
    recurrence_cooldown: 30m
    coalesce:
      enabled: true # fold a correlated alert storm into ONE investigation
    rate_limit:
      max_per_window: 20 # investigations per hour; the cost ceiling

  # Autonomy ladder, rung 2: RunLore proposes envelope-filtered remediations and
  # executes one ONLY after an explicit human approval (a token-gated POST, or Slack
  # Approve/Reject buttons). Nothing runs unattended — that is rung 3 (`mode: auto`),
  # which additionally requires auto.min_confidence / max_per_window. The envelope is
  # re-checked at execution time, and both rungs fail closed without the two
  # credentials below.
  actions:
    mode: approve
    approval_token_env: APPROVAL_TOKEN # also gates the /actions/pause kill-switch
    audit_log_path: /var/lib/runlore/catalog/audit.jsonl # hash-chained; fails closed on open
    allow:
      reversible_only: true # withhold irreversible suggestions entirely
      namespaces: [apps] # mirror rbac.actionNamespaces above
      max_blast_radius: 5
      kinds: [HelmRelease, Kustomization, Application]

  leader_election:
    enabled: true
    name: runlore-leader

  logging:
    format: json
    level: info
  telemetry:
    metrics_enabled: true
