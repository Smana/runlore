# Minimal profile — investigate + notify, nothing else. Read-only: no knowledge
# catalog, no curation, no actions. Create the `runlore-secrets` Secret and point
# Alertmanager at the webhook first; step up with values-standard.yaml.
#
# An OVERLAY on the chart's values.yaml, not the effective config: Helm deep-merges
# the two, so the running agent also carries the chart defaults absent here (the
# GitOps source, critical-only triggers, leader election, the investigation rate
# limit…). deploy/helm/runlore/values.yaml is the exhaustive list.
# https://runlore.io/docs/getting-started/#step-4--configure-and-install
replicaCount: 1              # one worker; values-full.yaml adds leader-elected HA
image:
  tag: ""                    # defaults to the chart appVersion; pin it in production
envFrom:
  - secretRef:
      name: runlore-secrets  # ANTHROPIC_API_KEY, RUNLORE_WEBHOOK_TOKEN, SLACK_WEBHOOK_URL
config:
  sources:
    alertmanager: {}         # presence is enablement — accept the alert webhook
  model:
    provider: anthropic      # or `openai` + base_url for any OpenAI-compatible endpoint
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
  server:
    webhook_token_env: RUNLORE_WEBHOOK_TOKEN  # MANDATORY once a model is set (serve fails closed)
  notify:
    slack:
      webhook_url_env: SLACK_WEBHOOK_URL
