# Standard profile — the whole loop on a real cluster: react, investigate with
# metrics + logs as evidence, deliver to chat, and LEARN (curate verified findings
# back to a knowledge-catalog repo as PRs). This is the profile most teams want.
#
# One rung down, values-minimal.yaml does investigate + notify only. One rung up,
# values-full.yaml adds HA, persistence, a locked-down NetworkPolicy, the action
# ladder, and the optional cloud / network-flow signals.
#
# This file is an OVERLAY on the chart's values.yaml, not the effective config: Helm
# deep-merges the two, so the running agent also carries the chart defaults nothing
# here mentions (resources, probes, the trigger debounces, the coalesce and
# rate-limit ceilings, leader election…). deploy/helm/runlore/values.yaml is the
# exhaustive list.
#
# Prerequisites — the KB repo, the GitHub App, and this Secret:
# https://runlore.io/docs/getting-started/#the-full-loop--production-install
#
#   kubectl -n runlore create secret generic runlore-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=RUNLORE_WEBHOOK_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=SLACK_WEBHOOK_URL=https://hooks.slack.com/services/... \
#     --from-file=GITHUB_APP_PRIVATE_KEY=/path/to/app-private-key.pem
#
#   helm install runlore oci://ghcr.io/smana/charts/runlore -n runlore \
#     --create-namespace -f values-standard.yaml
#
# Replace every `your-org` / placeholder ID below before installing.

replicaCount: 1 # one worker; values-full.yaml adds leader-elected HA

image:
  tag: "" # defaults to the chart appVersion; PIN IT in production

envFrom:
  - secretRef:
      name: runlore-secrets

# Git-sync the knowledge catalog into a WRITABLE mirror: RunLore clones the KB repo
# and re-pulls on an interval, so a merged curation PR flows straight back into what
# the agent searches — that is what closes the learning loop. (A static ConfigMap
# snapshot works too, via `configMap:`, but you refresh it by hand.)
catalog:
  gitSync: true
  mountPath: /var/lib/runlore/catalog

# Scrape RunLore's own /metrics (pairs with config.telemetry.metrics_enabled below).
# Needs the VictoriaMetrics Operator CRD — drop this block if you don't run it.
vmServiceScrape:
  enabled: true

config:
  gitops:
    engine: flux # or "argocd"

  # A key under `sources.<name>` turns that source on; its value is the source's
  # own config. Presence is enablement.
  sources:
    alertmanager: {} # the incident webhook
    gitops:
      enabled: true # also react to Flux/Argo CD Ready=False

  # Match POLICY for admitted alerts — the real filter on noise and LLM spend.
  triggers:
    incidents:
      match:
        severity: [critical, warning]
      dedup: { window: 30m } # don't re-investigate a still-firing alert within 30m

  model:
    provider: anthropic # or `openai` + base_url for any OpenAI-compatible endpoint
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY

  server:
    webhook_token_env: RUNLORE_WEBHOOK_TOKEN # MANDATORY once a model is set (serve fails closed)

  notify:
    slack:
      webhook_url_env: SLACK_WEBHOOK_URL

  # The catalog the investigation loop searches. `dir` MUST equal catalog.mountPath
  # above — that is the volume git-sync writes into.
  catalog:
    dir: /var/lib/runlore/catalog
    git:
      url: https://github.com/your-org/runlore-kb
      branch: main
      interval: 5m
      # token_env: KB_GIT_TOKEN  # optional; a PRIVATE repo reuses the App below by default

    # A SECOND, read-only catalog root, ON in this profile. Without it a fresh install
    # searches an empty catalog: the learning loop only starts paying once YOU have
    # curated entries, which is weeks of incidents away. The commons is a shared corpus
    # of generic playbooks (CrashLoopBackOff, ImagePullBackOff, unbound PVCs, stuck
    # cert-manager challenges…) so kb_search grounds an investigation from day one.
    #
    # What this does NOT do: commons entries never fire instant recall. They are
    # resource-less by construction — they describe a failure class, not one cluster's
    # workload — and recall's structural filter rejects a resource-less entry for any
    # alert carrying a workload. Day-one value here is BETTER INVESTIGATIONS, not the
    # cheap instant answers; those still require entries curated from your own incidents.
    #
    # Your own entries win scoring ties, and the curator never writes here — drafted
    # entries always land in your KB repo above. The commons can only ever be a floor.
    #
    # It tracks `main` of a repo you do not control, so upstream corrections reach you
    # without action. To review before it grounds anything, replace `branch` with `ref:`
    # — a tag or a full 40-character commit id (mutually exclusive with branch; the
    # agent refuses both). Removing the block entirely is also fine: everything else in
    # this profile still works.
    #
    # It cannot break your install. The commons syncer runs in the background, off the
    # startup path: if the clone fails — no egress, GitHub down, a typo here — it logs a
    # warning and the agent serves normally from your own catalog. The one cost of a
    # failed clone is that the retry waits a full `interval` (below), so a transient
    # failure at boot means no commons until the next tick or a pod restart.
    #
    # Egress: this is an HTTPS clone, so the chart's default NetworkPolicy (any
    # destination on 443) already allows it. Under `networkPolicy.strict: true` you must
    # add the host to egress.allowedCIDRs — already covered if your own KB repo is on
    # the same forge, and a separate entry if it is not.
    #
    # `dir` MUST sit outside catalog.dir; the chart refuses to render otherwise.
    commons:
      url: https://github.com/Smana/runlore-kb-commons
      branch: main
      interval: 24h # a shared corpus changes slowly; do not poll it like your own
      dir: /var/lib/runlore/commons

    # INSTANT RECALL IS OFF IN THIS PROFILE — deliberately. This is the one place where
    # the headline behaviour (a repeat incident answered in seconds for a fraction of the
    # cost) does NOT describe what you just installed, so it is worth saying plainly
    # rather than leaving you to wonder why it never fires.
    #
    # Why: a recall is not a cache hit. Its confidence is weighted by each entry's real
    # resolve rate, and that record lives in the outcome ledger — a file. This profile has
    # no persistent volume (catalog and commons are both emptyDir), so a ledger here would
    # reset on every restart and every entry would look untested forever. Recall would
    # still fire; it would just have no track record behind it, which is the property that
    # makes short-circuiting an investigation safe rather than reckless.
    #
    # To turn it on, add all three. The first is what makes the other two mean anything:
    #
    #   persistence:
    #     enabled: true
    #     size: 5Gi
    #   config:
    #     outcome:
    #       ledger_path: /var/lib/runlore/catalog/outcomes.jsonl  # under catalog.mountPath
    #     catalog:
    #       instant_recall:
    #         enabled: true
    #
    # Worth adding at the same time: notify.slack.feedback_buttons (which also requires
    # notify.slack.signing_secret_env) — 👍/👎 is what writes real outcomes to that ledger.
    # Without it the ledger records only what the loop infers, and trust decays more slowly
    # than your on-call's actual experience. values-full.yaml ships this whole set together.

  # Curation — the LEARN half. A verified, confident root cause opens a PR drafting
  # an OKF entry on the KB repo; anything below the bar is delivered to chat only.
  forge:
    kb_repo: your-org/runlore-kb
    base_branch: main
    skip_verdicts: [no_action] # benign/self-healed findings stay in chat, no PR
    github_app:
      app_id: 123456 # from the GitHub App you created
      installation_id: 7654321
      private_key_env: GITHUB_APP_PRIVATE_KEY

  # Evidence backends: each URL registers the tool it unlocks (query_metrics,
  # query_logs). Leave one out and the agent simply investigates without it.
  metrics:
    url: http://vmsingle.observability.svc:8429 # PromQL API base (or Prometheus on :9090)
  logs:
    url: http://victorialogs.observability.svc:9428 # LogsQL; for Loki add `provider: loki`

  # RunLore's own observability: JSON logs so they are ingestible, /metrics for the
  # VMServiceScrape above.
  logging:
    format: json
    level: info
  telemetry:
    metrics_enabled: true
