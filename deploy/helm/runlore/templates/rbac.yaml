{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "runlore.fullname" . }}
  labels:
    {{- include "runlore.labels" . | nindent 4 }}
rules:
  # React + what-changed: watch Flux Kustomizations, read GitRepositories.
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch"]
  # Deep read-only introspection (gitops_resource_status / gitops_tree): HelmReleases,
  # the other Flux source kinds, and Events.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories", "helmrepositories", "helmcharts", "buckets", "externalartifacts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # pod_status / kube_events triage the INCIDENT's namespace (an arbitrary workload
  # namespace, e.g. apps/payments), so pod STATUS reads must be cluster-wide. This grants
  # pod metadata/status only — NOT pods/log (raw log bodies), which is scoped to a
  # namespaced Role over rbac.controllerLogNamespaces below so secret-bearing logs are
  # not readable cluster-wide and fed to an external LLM. (Redaction of secrets that
  # still surface via status/event messages is a separate follow-up — roadmap R19.)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # nodes: LIST only, and only for cloud-identity resolution. A GKE node's
  # spec.providerID names the project and zone the cluster runs in, which is RunLore's
  # fallback when the GKE metadata server does not proxy the cluster attributes to Pods
  # (internal/providers/cloud/gcp/identity.go, tier 3). One node answers, so the read is
  # Limit(1) and happens once at startup.
  #
  # Node objects carry no secret material, but this is still a cluster-wide grant for a
  # fallback: if a live GKE run reports identity_source=metadata-server, tier 3 is not
  # needed on that cluster and this rule can go with it.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # Argo CD engine (config.gitops.engine: argocd).
  # applications: reactive watch (WatchFailures) + deep inspection (ResourceStatus/DependencyTree).
  # applicationsets: read-only during investigations — generator failures don't yet trigger
  #   the React loop (v2 roadmap), but the inspector can surface AppSet status as context.
  # appprojects: read-only during investigations — RBAC denials manifest as Application
  #   conditions; the inspector can cross-reference the project definition for root-cause.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch"]
  # NOTE: execution rights (patch) are intentionally NOT granted cluster-wide here.
  # They are scoped to rbac.actionNamespaces as namespaced Roles below, so a
  # confused/compromised agent cannot mutate flux-system or another team's workloads.
  # workload_ownership (G4) walks a failing pod's ownerReferences to its TOP controller
  # (Pod → ReplicaSet → Deployment/StatefulSet/DaemonSet, Job → CronJob) and reads the GitOps
  # tracking labels off it. These are the only controller kinds the walk can follow
  # (internal/providers/cluster/ownership.go, fetchOwner), and the tool is registered
  # unconditionally whenever the cluster reader is.
  #
  # Granted HERE, statically, and NOT left to rbac.resourceSpecRules — even though that
  # list happens to name the same kinds. They belong to a different consumer, and a
  # denial on one of them does not surface as an error: it STOPS the walk, and the last
  # resolvable hop is reported as the top controller. An operator narrowing an allowlist
  # documented as belonging to resource_spec would otherwise turn every "Deployment X,
  # owned by Kustomization Y" into a bare "ReplicaSet X" — quietly, suite green.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get"]
  # resource_spec (read an arbitrary object's .spec/.status): an operator-owned, read-only
  # allowlist of spec-bearing kinds — see rbac.resourceSpecRules in values.yaml, which also
  # explains why a `resources: ["*"]` wildcard must never include secrets. A kind missing
  # from the list is reported to the agent as a DENIAL, never as a missing object, so a gap
  # here degrades the tool rather than fabricating evidence.
  #
  # It ships POPULATED — a default grant, not an opt-in menu. `rbac.resourceSpecRules: []`
  # declines it in full and still renders valid YAML (that is what the guard below is
  # for), leaving every rule above intact.
  {{- with .Values.rbac.resourceSpecRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "runlore.fullname" . }}
  labels:
    {{- include "runlore.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "runlore.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "runlore.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Namespaced lease access for leader election (HA).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "runlore.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runlore.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "runlore.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runlore.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "runlore.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "runlore.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.rbac.controllerLogNamespaces }}
{{- if or (not $.Values.rbac.skipMissingControllerLogNamespaces) (lookup "v1" "Namespace" "" .) }}
---
# controller_logs: read RAW gitops controller pod logs in THIS namespace only
# (flux-system for Flux, argocd for ArgoCD — set via rbac.controllerLogNamespaces) —
# never cluster-wide — because pod logs may carry secrets/PII and tool output is sent
# to an external LLM. pods get/list is repeated here (in addition to the cluster-wide
# grant) so the Role is self-contained: controller_logs lists the matching controller
# pods before streaming pods/log.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "runlore.fullname" $ }}-controller-logs
  namespace: {{ . }}
  labels:
    {{- include "runlore.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "runlore.fullname" $ }}-controller-logs
  namespace: {{ . }}
  labels:
    {{- include "runlore.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "runlore.fullname" $ }}-controller-logs
subjects:
  - kind: ServiceAccount
    name: {{ include "runlore.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.rbac.allowActions }}
{{- range .Values.rbac.actionNamespaces }}
---
# Namespace-scoped execution rights (config.actions): patch GitOps resources (Flux
# Kustomizations/HelmReleases, Argo CD Applications) in THIS namespace only — never
# cluster-wide — so the blast radius is bounded. The set should mirror
# config.actions.allow.namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "runlore.fullname" $ }}-actions
  namespace: {{ . }}
  labels:
    {{- include "runlore.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "patch"]
  # Argo CD executor (config.gitops.engine: argocd): pause/resume auto-sync and
  # refresh are merge patches on the Application; pause/resume also GET the app
  # first to read/restore the prior sync policy, so the Role is self-contained.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "runlore.fullname" $ }}-actions
  namespace: {{ . }}
  labels:
    {{- include "runlore.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "runlore.fullname" $ }}-actions
subjects:
  - kind: ServiceAccount
    name: {{ include "runlore.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
