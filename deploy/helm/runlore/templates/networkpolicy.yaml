{{- if .Values.networkPolicy.enabled -}}
# Network posture for the agent. Ingress: only the webhook/health port is reachable. Egress:
# DNS is scoped to the cluster DNS service, and HTTPS + the Kubernetes API are allowed to any
# destination by default. Set networkPolicy.strict=true to deny egress by default and allow only
# the destinations declared in networkPolicy.egress (model/forge/observability CIDRs, in-cluster
# namespaceSelectors, and the API server); networkPolicy.extraEgress is appended in either mode.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runlore.fullname" . }}
  labels:
    {{- include "runlore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "runlore.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
      {{- with .Values.networkPolicy.ingressFrom }}
      # Scope who may reach the webhook port (e.g. the Alertmanager namespace).
      # Empty (default) ⇒ no `from:` ⇒ all sources allowed (permissive, no break).
      from:
        # Replica-to-replica forwarding (#264): a non-leader replica proxies
        # work-bearing requests to the leader pod on this same port, so peer
        # pods of this release must stay reachable however ingressFrom narrows
        # the external sources.
        - podSelector:
            matchLabels:
              {{- include "runlore.selectorLabels" $ | nindent 14 }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # Replica-to-replica forwarding (#264): a non-leader replica proxies
    # work-bearing requests to the leader pod on the serve port. Allowed in BOTH
    # egress modes — the permissive default only opens 443/6443 and strict mode
    # denies by default, so without this rule forwarding would be silently
    # dropped by the CNI.
    - to:
        - podSelector:
            matchLabels:
              {{- include "runlore.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # DNS — scoped to the cluster DNS service by default (override/disable via networkPolicy.egress.dns).
    {{- if .Values.networkPolicy.egress.dns.toClusterDNS }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- else }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.strict }}
    # strict: deny egress by default — allow only the declared destinations.
    {{- range .Values.networkPolicy.egress.allowedCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- range .Values.networkPolicy.egress.namespaceSelectors }}
    - to:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- range .Values.networkPolicy.egress.apiServerCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- else }}
    # permissive default: HTTPS (model/git/observability) + the Kubernetes API to any destination.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if or .Values.networkPolicy.awsPodIdentity .Values.networkPolicy.gcpWorkloadIdentity }}
---
# Cloud in-cluster identity: allow the node-local credential endpoint.
#
# Both clouds need the same thing, which is why this is ONE policy rather than two. The
# credential endpoint runs on the node host network at a link-local address on :80 —
# 169.254.170.23 for EKS Pod Identity, 169.254.169.254 for the GKE metadata server (and
# Azure IMDS, when that arrives). Cilium classifies all of them as the "host" entity,
# which a Kubernetes NetworkPolicy ipBlock cannot match, so the credential fetch is
# silently DROPPED and no ipBlock rule can fix it. A CiliumNetworkPolicy toEntities:
# [host] is the supported way to allow it, and "the node's host entity on :80" is
# already cloud-independent — the two policies this replaced had byte-identical specs
# and differed only in name.
#
# The failure does not look like a network failure, on either cloud. With no token the
# cloud SDK reports a CREDENTIALS error, and RunLore's preflight answers a credentials
# error with an IAM binding command — so the operator adds a binding that is already
# correct, the symptom does not move, and nothing anywhere mentions egress.
#
# Enable when cloud.provider is set AND the cluster runs Cilium. Either toggle turns it
# on; they are kept separate because they are the operator-facing API and their
# documentation legitimately differs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "runlore.fullname" . }}-cloud-identity-host-egress
  labels:
    {{- include "runlore.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "runlore.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities: [host]
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
{{- end }}
{{- end }}
